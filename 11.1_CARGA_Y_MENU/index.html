<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú y Loader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="icon" href="https://static.vecteezy.com/system/resources/thumbnails/024/652/383/small_2x/11-number-balloon-pink-png.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="loader-section" class="screen-center">
        <div class="loader-container">
            <div class="progress-bar">
                <svg class="circle" viewBox="0 0 120 120">
                    <circle class="circle-background" cx="60" cy="60" r="54" />
                    <circle class="circle-progress" cx="60" cy="60" r="54" />
                </svg>
                <span class="percentage">0%</span>
            </div>
            <span class="status">Cargando...</span>
        </div>
    </div>

    <div id="main-app" class="hidden fade-in">
        <div class="sidebar">
            <div class="logo">Menu</div>
            <ul class="sidebar-nav">
                <li class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </li>
                <li class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Perfil</span>
                </li>
                <li class="nav-item">
                    <i class="fas fa-envelope"></i>
                    <span>Mensajes</span>
                </li>
                <li class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Configuración</span>
                </li>
                <li class="nav-item">
                    <i class="fas fa-info-circle"></i>
                    <span>Acerca de</span>
                </li>
            </ul>
        </div>

        <div class="welcome-content">
            <h1 class="welcome-text">¡Bienvenido!</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
